customHeaders:
  # PWA correctness: never cache the shell or the service-worker control files, or
  # users get stuck on a stale build. The hashed chunks below are safe to cache hard.
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/ngsw.json'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/ngsw-worker.js'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  # Fingerprinted assets (outputHashing: all) are immutable.
  - pattern: '*.js'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '*.css'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # Baseline security headers on every response.
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: X-Frame-Options
        value: 'DENY'
      # camera=(self) enables the QR bib scanner (getUserMedia) on the app's own
      # origin while still blocking cross-origin iframes. An empty camera=() list
      # disables it everywhere — the browser then rejects getUserMedia with no
      # permission prompt at all. geolocation/microphone stay off (unused).
      - key: Permissions-Policy
        value: 'geolocation=(), camera=(self), microphone=()'

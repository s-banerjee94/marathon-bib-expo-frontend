<li class="mb-1">
  <a
    (click)="onItemClick()"
    [routerLink]="item().routerLink"
    routerLinkActive="active-route"
    [routerLinkActiveOptions]="{ exact: false }"
    [attr.aria-label]="item().label"
    [pTooltip]="item().label"
    tooltipPosition="right"
    [tooltipDisabled]="!showTooltip()"
    class="menu-link flex items-center py-3 px-4 rounded-lg no-underline cursor-pointer transition-colors duration-150 max-[991px]:min-h-12 max-[991px]:py-3.5"
    pRipple
  >
    @if (item().icon) {
      <i [class]="item().icon" class="mr-3 text-lg"></i>
    }
    <span class="flex-1 text-sm font-medium">{{ item().label }}</span>
  </a>
</li>

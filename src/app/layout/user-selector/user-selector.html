@if (showFloatLabel()) {
  <p-floatlabel variant="on">
    <p-autocomplete
      (completeMethod)="onUserSearch($event)"
      (onClear)="onUserClear()"
      (onSelect)="onUserSelect($event)"
      [(ngModel)]="selectedUser"
      [delay]="autocompleteDelay"
      [disabled]="disabled()"
      [dropdown]="true"
      [fluid]="fluid()"
      [forceSelection]="true"
      [inputId]="inputId()"
      [name]="inputId()"
      [placeholder]="placeholder()"
      [required]="required()"
      [showClear]="true"
      [size]="size()"
      [suggestions]="userSuggestions()"
      appendTo="body"
      emptyMessage="No users found."
      optionLabel="fullName"
      scrollHeight="300px"
    >
      <ng-template let-user pTemplate="item">
        <div class="flex w-full items-center gap-3 py-1">
          <p-avatar [label]="getInitials(user)" shape="circle" />
          <div class="flex flex-col flex-1 min-w-0">
            <span
              [innerHTML]="user.fullName | highlight: currentSearchTerm()"
              class="font-semibold truncate"
            ></span>
            <span
              [innerHTML]="'@' + user.username | highlight: currentSearchTerm()"
              class="text-xs opacity-70 truncate"
            ></span>
          </div>
        </div>
      </ng-template>
    </p-autocomplete>
    <label [for]="inputId()">{{ label() }}</label>
  </p-floatlabel>
} @else {
  <p-autocomplete
    (completeMethod)="onUserSearch($event)"
    (onClear)="onUserClear()"
    (onSelect)="onUserSelect($event)"
    [(ngModel)]="selectedUser"
    [delay]="autocompleteDelay"
    [disabled]="disabled()"
    [dropdown]="true"
    [fluid]="fluid()"
    [forceSelection]="true"
    [inputId]="inputId()"
    [name]="inputId()"
    [placeholder]="placeholder()"
    [required]="required()"
    [showClear]="true"
    [size]="size()"
    [suggestions]="userSuggestions()"
    emptyMessage="No users found."
    optionLabel="fullName"
    scrollHeight="300px"
  >
    <ng-template let-user pTemplate="item">
      <div class="flex w-full items-center gap-3 py-1">
        <p-avatar [label]="getInitials(user)" shape="circle" />
        <div class="flex flex-col flex-1 min-w-0">
          <span
            [innerHTML]="user.fullName | highlight: currentSearchTerm()"
            class="font-semibold truncate"
          ></span>
          <span
            [innerHTML]="'@' + user.username | highlight: currentSearchTerm()"
            class="text-xs opacity-70 truncate"
          ></span>
        </div>
      </div>
    </ng-template>
  </p-autocomplete>
}

<ng-content select="[error]"></ng-content>

<div class="flex flex-col min-h-full">
  <ul class="list-none p-0 m-0">
    @for (item of filteredMenu(); track item.label) {
      <app-menuitem [item]="item" />
    }
  </ul>

  @if (filteredBottomMenu().length > 0) {
    <ul class="list-none p-0 m-0 mt-auto pt-4 border-t" style="border-color: var(--surface-border)">
      @for (item of filteredBottomMenu(); track item.label) {
        <app-menuitem [item]="item" />
      }
    </ul>
  }
</div>

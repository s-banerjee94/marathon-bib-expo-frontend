<form #orgForm="ngForm" (ngSubmit)="onSubmit(orgForm)" class="flex flex-col gap-4 mt-2">
  <!-- Contact, address, and business fields (shared with the edit page) -->
  <app-organization-fields-form [model]="organization" [submitted]="orgForm.submitted" />

  <!-- Subscription Settings Section -->
  <div class="pt-2">
    <h3 class="text-lg font-semibold mb-4">Subscription Settings (Optional)</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Subscription Tier -->
      <div class="flex flex-col gap-1">
        <p-floatlabel variant="on">
          <p-select
            [(ngModel)]="organization.subscriptionTier"
            [checkmark]="true"
            [options]="subscriptionTiers"
            [size]="inputSize"
            appendTo="body"
            fluid="true"
            id="subscriptionTier"
            name="subscriptionTier"
            optionLabel="label"
            optionValue="value"
            placeholder="Select a tier"
          ></p-select>
          <label for="subscriptionTier">Subscription Tier</label>
        </p-floatlabel>
      </div>

      <!-- Billing Email -->
      <div class="flex flex-col gap-1">
        <p-floatlabel variant="on">
          <input
            #billingEmail="ngModel"
            [(ngModel)]="organization.billingEmail"
            [invalid]="billingEmail.invalid && (billingEmail.touched || orgForm.submitted)"
            [pSize]="inputSize"
            autocomplete="email"
            email
            fluid="true"
            id="billingEmail"
            name="billingEmail"
            pInputText
            type="email"
          />
          <label for="billingEmail">Billing Email</label>
        </p-floatlabel>
        @if (billingEmail.invalid && (billingEmail.touched || orgForm.submitted)) {
          <p-message [size]="inputSize" severity="error" variant="simple">
            Please enter a valid email.
          </p-message>
        }
      </div>
    </div>

    <!-- User Quota -->
    <div class="mt-4">
      <h4 class="font-medium mb-3">User Quotas</h4>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col gap-1">
          <p-floatlabel variant="on">
            <p-inputnumber
              [(ngModel)]="organization.userQuota!.admins!.max"
              [min]="1"
              [showButtons]="true"
              [size]="inputSize"
              fluid="true"
              inputId="maxAdmins"
              name="maxAdmins"
            ></p-inputnumber>
            <label for="maxAdmins">Max Admins</label>
          </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1">
          <p-floatlabel variant="on">
            <p-inputnumber
              [(ngModel)]="organization.userQuota!.organizerUsers!.max"
              [min]="1"
              [showButtons]="true"
              [size]="inputSize"
              fluid="true"
              inputId="maxOrganizerUsers"
              name="maxOrganizerUsers"
            ></p-inputnumber>
            <label for="maxOrganizerUsers">Max Organizer Users</label>
          </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1">
          <p-floatlabel variant="on">
            <p-inputnumber
              [(ngModel)]="organization.userQuota!.distributors!.max"
              [min]="1"
              [showButtons]="true"
              [size]="inputSize"
              fluid="true"
              inputId="maxDistributors"
              name="maxDistributors"
            ></p-inputnumber>
            <label for="maxDistributors">Max Distributors</label>
          </p-floatlabel>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 pt-2 justify-end">
    <p-button
      [disabled]="isSubmitting() || orgForm.invalid"
      [label]="isSubmitting() ? 'Creating...' : 'Create Organization'"
      [loading]="isSubmitting()"
      [size]="inputSize"
      icon="pi pi-check"
      type="submit"
    />
  </div>
</form>

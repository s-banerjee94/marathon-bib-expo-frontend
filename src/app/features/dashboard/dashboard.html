@switch (role()) {
  @case (UserRole.ROOT) {
    <app-root-dashboard />
  }
  @case (UserRole.ADMIN) {
    <app-admin-dashboard />
  }
  @case (UserRole.ORGANIZER_ADMIN) {
    <app-org-admin-dashboard />
  }
  @case (UserRole.ORGANIZER_USER) {
    <app-org-user-dashboard />
  }
  @case (UserRole.DISTRIBUTOR) {
    <app-distributer-dashboard />
  }
}

<div class="flex flex-col gap-4">
  <div>
    <h2 class="text-xl font-semibold mb-1">Campaign sender</h2>
    <p class="text-color-secondary text-sm m-0">
      Optionally send this organization's SMS and WhatsApp campaigns through your own provider. When
      no override is set or it's disabled, campaigns use the platform-default sender.
    </p>
  </div>

  @if (orgScope(); as scope) {
    <app-campaign-provider-console [scope]="scope" />
  }
</div>

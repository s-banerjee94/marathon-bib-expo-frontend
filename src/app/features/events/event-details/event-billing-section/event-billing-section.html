<div class="space-y-4">
  <!-- Header -->
  <div class="flex justify-between items-center gap-3">
    <div>
      <h2 class="text-xl font-semibold">Bills</h2>
      <p class="text-sm opacity-60">Invoices generated for this event.</p>
    </div>
    @if (canManage) {
      <span [pTooltip]="generateTooltip()" tooltipPosition="left">
        <p-button
          [label]="isMobile() ? '' : 'Generate Bill'"
          icon="pi pi-receipt"
          [size]="buttonSize"
          [loading]="generating()"
          [disabled]="!isBillable() || isLoading()"
          (onClick)="onGenerate($event)"
        />
      </span>
    }
  </div>

  @if (isLoading()) {
    <div class="flex flex-col gap-2 py-4">
      <p-skeleton height="2rem" width="40%" />
      <p-skeleton height="3rem" />
      <p-skeleton height="3rem" />
      <p-skeleton height="3rem" />
    </div>
  } @else if (bills().length === 0) {
    <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
      <i class="pi pi-receipt text-6xl mb-4 opacity-30"></i>
      <p class="text-lg font-medium mb-1">No bills yet</p>
      <p class="text-sm opacity-60">
        A draft is generated automatically a few hours after the event is completed or cancelled.
      </p>
    </div>
  } @else {
    <!-- Draft/Final switcher — only when more than one bill exists -->
    @if (bills().length > 1) {
      <p-selectbutton
        [ngModel]="selectedBillId()"
        (ngModelChange)="selectedBillId.set($event)"
        [options]="billOptions()"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        [size]="inputSize"
      />
    }

    <app-bill-detail
      [bill]="selectedBill()"
      [eventId]="eventId()"
      [canManage]="canManage"
      (billChange)="onBillChange($event)"
      (issueFinal)="onIssueFinal()"
    />
  }
</div>

<p-confirmpopup />

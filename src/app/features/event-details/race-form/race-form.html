<form #raceForm="ngForm" (ngSubmit)="onSubmit(raceForm)" class="flex flex-col gap-4 mt-2">
  <!-- Race Name -->
  <div class="flex flex-col gap-1">
    <p-floatlabel variant="on">
      <input
        #raceName="ngModel"
        [(ngModel)]="formData.raceName"
        [invalid]="shouldShowError(raceName, raceForm.submitted)"
        [pSize]="inputSize"
        fluid="true"
        id="raceName"
        maxlength="200"
        minlength="2"
        name="raceName"
        pInputText
        required
      />
      <label for="raceName">Race Name *</label>
    </p-floatlabel>
    @if (shouldShowError(raceName, raceForm.submitted)) {
      <p-message [size]="inputSize" severity="error" variant="simple">
        @if (raceName.hasError('required')) {
          Race name is required.
        }
        @if (raceName.hasError('minlength')) {
          Race name must be at least 2 characters.
        }
        @if (raceName.hasError('maxlength')) {
          Race name must not exceed 200 characters.
        }
      </p-message>
    }
  </div>

  <!-- Race Description -->
  <div class="flex flex-col gap-1">
    <p-floatlabel variant="on">
      <textarea
        [(ngModel)]="formData.raceDescription"
        [pSize]="inputSize"
        fluid="true"
        id="raceDescription"
        maxlength="500"
        name="raceDescription"
        pTextarea
        rows="4"
      ></textarea>
      <label for="raceDescription">Description</label>
    </p-floatlabel>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-4 border-t">
    <button (click)="onCancel()" [outlined]="true" pButton severity="secondary" type="button">
      <span pButtonLabel>Cancel</span>
    </button>
    <button [disabled]="raceForm.invalid || isSubmitting()" pButton type="submit">
      <span pButtonLabel>{{ isEditMode() ? 'Update Race' : 'Create Race' }}</span>
    </button>
  </div>
</form>

<section id="features" class="scroll-mt-[var(--topbar-height)] py-24">
  <div class="mx-auto max-w-[1200px] px-7">
    <div class="mb-14 max-w-[720px]">
      <span
        class="inline-flex items-center gap-2.5 text-xs font-bold tracking-[0.12em] text-[var(--text-color-secondary)] uppercase before:h-px before:w-6 before:bg-current before:content-['']"
        >Capabilities</span
      >
      <h2
        class="my-4 text-[clamp(36px,4.5vw,56px)] leading-[1.05] font-extrabold tracking-[-0.03em] text-[var(--text-color)]"
      >
        Everything race ops actually needs.<br />Nothing they don't.
      </h2>
      <p class="max-w-[620px] text-lg leading-[1.55] text-[var(--text-color-secondary)]">
        Built around the actual job: get bibs into the right hands, fast, with an audit trail. No
        social features, no AI assistants, no gamification.
      </p>
    </div>
    <div
      class="grid grid-cols-1 gap-px overflow-hidden rounded-xl border border-[var(--surface-border)] bg-[var(--surface-border)] min-[900px]:grid-cols-3"
    >
      @for (f of items; track f.title) {
        <div class="relative flex flex-col gap-3 bg-[var(--surface-card)] px-7 py-8">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-[var(--surface-hover)] text-lg text-[var(--text-color)]"
          >
            <i class="pi pi-{{ f.icon }}"></i>
          </div>
          <h3 class="mt-1 text-lg font-bold tracking-[-0.015em]">{{ f.title }}</h3>
          <p class="text-sm leading-[1.55] text-[var(--text-color-secondary)]">{{ f.body }}</p>
        </div>
      }
    </div>
  </div>
</section>

<section
  class="relative overflow-hidden bg-[var(--primary-color)] py-16 text-[var(--primary-contrast-color)] before:pointer-events-none before:absolute before:inset-0 before:bg-[repeating-linear-gradient(-8deg,transparent_0,transparent_60px,rgba(255,255,255,0.04)_60px,rgba(255,255,255,0.04)_61px)] before:content-['']"
>
  <div class="relative z-[1] mx-auto max-w-[1200px] px-7">
    <div class="grid grid-cols-2 gap-8 min-[900px]:grid-cols-4">
      @for (s of stats; track s.cap) {
        <div>
          <div
            class="text-[clamp(40px,5vw,64px)] leading-none font-extrabold tracking-[-0.03em] tabular-nums"
          >
            {{ s.num }}<span class="ml-1 text-[0.5em] font-semibold opacity-60">{{ s.unit }}</span>
          </div>
          <div class="mt-2 text-xs font-semibold tracking-[0.08em] uppercase opacity-70">
            {{ s.cap }}
          </div>
        </div>
      }
    </div>
  </div>
</section>

@if (isMobile()) {
  <p-button
    (click)="openDialog()"
    [size]="inputSize"
    [outlined]="true"
    icon="pi pi-filter"
    [label]="triggerLabel()"
  >
    @if (hasActive()) {
      <p-badge [value]="activeFilterCount().toString()" severity="info" class="ml-2" />
    }
  </p-button>

  <p-dialog
    [(visible)]="dialogVisible"
    [header]="dialogHeader()"
    [modal]="true"
    [dismissableMask]="true"
    [draggable]="false"
    [resizable]="false"
    [focusOnShow]="false"
    [style]="{ width: '92vw', maxWidth: '32rem' }"
    appendTo="body"
  >
    <div class="flex flex-col gap-4 py-2">
      @if (filtersTemplate()) {
        <ng-container *ngTemplateOutlet="filtersTemplate()!" />
      }
    </div>

    @if (showApply()) {
      <ng-template #footer>
        <div class="flex justify-end">
          <p-button (click)="onApply()" [size]="inputSize" icon="pi pi-check" label="Apply" />
        </div>
      </ng-template>
    }
  </p-dialog>
} @else {
  <div class="flex flex-wrap items-center gap-6">
    @if (filtersTemplate()) {
      <ng-container *ngTemplateOutlet="filtersTemplate()!" />
    }
  </div>
}

<!-- Surfaces only in print output; invisible on screen. -->
<header class="hidden print:block mb-4 pb-2 border-b">
  <h1 class="text-2xl font-bold">{{ title() }}</h1>
  <div class="text-sm mt-1">
    <ng-content />
  </div>
  <p class="text-sm mt-1">Printed at {{ printedAt() | date: 'dd-MMM-yyyy, hh:mm a' }}</p>
</header>
